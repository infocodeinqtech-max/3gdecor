
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/png" href="/src/assets/images/fav.png" />
      <title>3G Decorative Group</title>
      <style>
        /* Reserve scrollbar space from first paint so hero/nav don't jump when
           loader ends and page content grows past the viewport. */
        html {
          margin: 0;
          overflow-y: scroll;
          scrollbar-gutter: stable;
          overflow-x: hidden;
        }
        body {
          margin: 0;
          min-height: 100%;
          width: 100vw;
          overflow-x: hidden;
        }
        #root {
          min-height: 100%;
        }
      </style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
